{{template "header.html" .}}

<div class="p-4 mb-5 bg-dark rounded-3 border border-secondary-subtle shadow-sm">
    <div class="container-fluid py-2">
        <h1 class="display-6 fw-bold font-monospace text-light mb-2">Network Diagnostics Center</h1>
        <p class="text-secondary mb-0">
            Suite de herramientas asíncronas L2/L7 sobre arquitectura Golang nativa. Cero dependencias FPM.
        </p>
    </div>
</div>

<div class="row g-4">
    {{range .Tools}}
    <div class="col-md-6 col-lg-4">
        <div class="card h-100 tool-card rounded-3 d-flex flex-column">
            <div class="card-body d-flex flex-column p-4">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <h5 class="card-title fw-bold text-light mb-0">{{.Name}}</h5>
                    <span class="badge bg-dark border border-secondary font-monospace">{{.Badge}}</span>
                </div>
                <p class="card-text text-secondary small flex-grow-1 mt-2 mb-4">{{.Desc}}</p>
                <a href="{{.File}}" class="btn btn-outline-primary btn-sm w-100 font-monospace mt-auto">
                    EJECUTAR_HERRAMIENTA &rarr;
                </a>
            </div>
        </div>
    </div>
    {{end}}
</div>

{{template "footer.html" .}}
